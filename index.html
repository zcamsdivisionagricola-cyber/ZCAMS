<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Z CAMS División Agrícola</title><style id="css">:root{--bg:#f6f4ee;--surface:#fff;--text:#1d2a1f;--muted:#5d6b5f;--green:#2f6b2f;--green-d:#1f4d20;--accent:#e0a526;--line:#ddd9cb;--on-green:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a13;--surface:#1b261c;--text:#eef2e8;--muted:#a3b2a4;--green:#5fae5f;--green-d:#8fd08f;--line:#2d3b2e;--on-green:#0f1a10}}
:root[data-theme="dark"]{--bg:#121a13;--surface:#1b261c;--text:#eef2e8;--muted:#a3b2a4;--green:#5fae5f;--green-d:#8fd08f;--line:#2d3b2e;--on-green:#0f1a10}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header{background:#f9f6f1;border-bottom:3px solid #1f4d20}
.nav{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:12px}
.nav img{height:54px;width:auto;display:block}
.btn{display:inline-block;background:var(--accent);color:#1d2a1f;font-weight:700;padding:11px 20px;border-radius:10px;text-decoration:none;border:0;cursor:pointer;font-size:1rem;font-family:inherit}
.hero{padding:44px 0 52px;background:linear-gradient(160deg,#1f4d20,#2f6b2f);color:#fff}
.hero h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.15;margin:0 0 12px}
.hero p{max-width:560px;font-size:1.08rem;opacity:.92;margin:0 0 22px}
.hero .btn+.btn{background:transparent;color:#fff;border:2px solid #fff;margin:6px 0 0 6px}
section{padding:40px 0}
h2{font-size:1.6rem;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{background:var(--surface);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.95rem;font-family:inherit}
.chip.on{background:var(--green);color:var(--on-green);border-color:var(--green)}
.chip.add{border-style:dashed;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:100px;display:flex;align-items:center;justify-content:center;font-size:3.2rem;background:linear-gradient(135deg,rgba(47,107,47,.18),rgba(224,165,38,.22));position:relative}
.thumb.ph{height:190px;cursor:zoom-in;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:.78rem;padding:2px 8px;border-radius:999px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;color:var(--green-d);font-weight:700}
.card h3{margin:0;font-size:1.15rem}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.78rem;background:rgba(47,107,47,.14);color:var(--green-d);padding:2px 9px;border-radius:999px;font-weight:600}
.badge.st{background:rgba(224,165,38,.25);color:var(--text)}
.card ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:.92rem}
.pago{font-size:.9rem;margin-top:6px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;gap:8px}
.state{font-size:.85rem;color:var(--muted)}
.card .btn{padding:9px 14px;font-size:.92rem}
.btn.ed{background:var(--green);color:var(--on-green)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.box h3{margin:0 0 4px;font-size:1.2rem}
.box p{margin:0 0 10px;color:var(--muted)}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:700}
.prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.prod div{font-size:.9rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.prod small{display:block;color:var(--muted)}
.contact{background:#1f4d20;color:#fff;border-radius:16px;padding:28px;text-align:center}
.contact h2{color:#fff}
.contact .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.contact a.m{color:#fff}
footer{padding:24px 0 90px;color:var(--muted);font-size:.9rem;text-align:center}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--green-d);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:20}
:root:not([data-theme="light"]) .savebar{color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.dlg{background:var(--surface);color:var(--text);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.dlg h3{margin:0 0 10px}
.dlg label,.lbl{display:block;font-size:.85rem;color:var(--muted);margin-bottom:10px;font-weight:600}
.dlg input,.dlg textarea,.dlg select{display:block;width:100%;margin-top:3px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pths{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pt{position:relative;width:76px;height:76px}
.pt img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.pt button{position:absolute;top:-6px;right:-6px;border:0;background:#b3261e;color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer}
.acts{display:flex;gap:8px;margin-top:14px;align-items:center}
.btn.gr{background:var(--line);color:var(--text)}
.btn.del{background:#b3261e;color:#fff}
.lbx{align-items:center;background:rgba(0,0,0,.92)}
.lbx img{max-width:100%;max-height:88%;object-fit:contain}
.nv{position:absolute;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:2rem;width:46px;height:46px;border-radius:50%;cursor:pointer}
.nv.l{left:10px;top:50%}.nv.r{right:10px;top:50%}.nv.x{right:10px;top:calc(10px + env(safe-area-inset-top,0px));font-size:1.2rem}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem}

["Insecticidas",[["RINAX","Clorantraniliprole 20% SC"],["ARANYA PLUS 8,4%","Abamectina 8,4% SC"],["TIALOXIN","Tiametoxam 14,1% + Lambdacialotrina 10,6% SC"],["PRIDE 35%","Imidacloprid 35% SC"],["TRINPRID 3-10","Bifentrin 3% + Imidacloprid 10% SC"],["BENEFIT 15%","Alfacipermetrina 15% EC"],["ARANYA 3,6% EC","Abamectina 3,6% EC"],["SOKFORTE 25 EC","Bifentrin 25% EC"],["CIALOTRIN 25 ME","Lambdacialotrina 25% ME"],["CIALOTRIN 5","Lambdacialotrina 5% EC"]]],
["Fungicidas",[["AZOXICONAZOLE 20-8","Azoxistrobina 20% + Ciproconazole 8% SC"],["TRITON 17,5-15","Protioconazole 17,5% + Trifloxistrobin 15% SC"]]],
["Tratamiento de semillas",[["SID GARD 60%","Imidacloprid 60% SC"]]],
["Coadyuvantes",[["ABSOLUT","Aceite metilado 25% ME"],["GLOBALOIL","Aceite vegetal"],["UNIVERSAL OIL","Aceite vegetal"],["SOLY-OIL METIL","Aceite metilado de soja"],["SOLY-OIL VEGETAL","Aceite vegetal e insecticida"],["SOLY-OIL MINERAL","Aceite mineral"],["BIO-NASS","Lecitina de soja 35% EC"],["NASS-50","Nonil fenol 50% SL"],["NASS-KELL","Nonil fenol 45% SL"],["ION-TRAP","Ácido fosfórico 30% SL"]]],
["Fertilizantes",[["VULCANO","Fertilizante foliar líquido a base de sulfato de amonio"],["SULFA-FIX","Sulfato de amonio"]]]];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wa=t=>"https://wa.me/"+TEL+"?text="+encodeURIComponent(t);
const ico=c=>({Tractores:"🚜",Sembradoras:"🌱",Pulverizadoras:"💧",Cosechadoras:"🌾",Acoplados:"🚛"}[c]||"⚙️");
const HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Z CAMS División Agrícola</title>';
let canEdit=false,editing=false,dirty=false;const cat={maq:"Todas",rol:"Todas"};
function card(k,it){
 const ph=it.ph||[];
 const th=ph.length?`<div class="thumb ph" data-a="lb" data-k="${k}" data-id="${it.id}"><img loading="lazy" alt="${esc(it.n)}" src="${bl(ph[0])}">${ph.length>1?`<span class="cnt">📷 ${ph.length}</span>`:""}</div>`:`<div class="thumb">${ico(it.c)}</div>`;
 const bd=[it.y?`<span class="badge">Año ${esc(it.y)}</span>`:"",it.e?`<span class="badge">${esc(it.e)}</span>`:"",it.s&&it.s!=="Disponible"?`<span class="badge st">${esc(it.s)}</span>`:""].join("");
 return `<div class="card">${th}<div class="body"><span class="tag">${esc(it.c)}</span><h3>${esc(it.n)}</h3><div class="badges">${bd}</div>
 ${it.d&&it.d.length?`<ul>${it.d.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
 ${it.p?`<div class="pago"><b>Forma de pago:</b> ${esc(it.p)}</div>`:""}
 <div class="meta"><span class="state">${it.pr?"<b>"+esc(it.pr)+"</b>":"Precio a consultar"}</span>
 <span>${editing?`<button class="btn ed" data-a="edit" data-k="${k}" data-id="${it.id}">✏️ Editar</button>`:`<a class="btn" target="_blank" rel="noopener" href="${wa("Hola, quiero consultar por: "+it.n)}">Consultar</a>`}</span></div></div></div>`;
}
function sect(c){
 const L=S[c.k],cats=["Todas",...new Set(L.map(x=>x.c))];
 if(!cats.includes(cat[c.k]))cat[c.k]="Todas";
 const v=L.filter(x=>cat[c.k]==="Todas"||x.c===cat[c.k]);
 return `<section id="${c.id}"><div class="wrap"><h2>${esc(c.t)}</h2><p class="sub">${esc(c.s)}</p>
 <div class="filters">${cats.map(x=>`<button class="chip ${x===cat[c.k]?"on":""}" data-a="cat" data-k="${c.k}" data-c="${esc(x)}">${esc(x)}</button>`).join("")}${editing?`<button class="chip add" data-a="add" data-k="${c.k}">＋ Agregar</button>`:""}</div>
 <div class="grid">${v.map(x=>card(c.k,x)).join("")||'<p class="sub">Todavía no hay productos acá.</p>'}</div></div></section>`;
}
function render(){
 $("root").innerHTML=`<header><div class="wrap nav"><img alt="Z CAMS División Agrícola" src="${S.logo}"><a class="btn" href="#contacto">Consultar</a></div></header>
 <div class="hero"><div class="wrap"><h1>Maquinaria agrícola e insumos para el agro</h1><p>Equipos en stock, tractores Roland H, insumos Laboratorios Peyte y semillas de maíz DEKALB. Consultanos directamente, te asesoramos.</p><a class="btn" href="#stock">Ver maquinaria en stock</a><a class="btn" href="#roland">Roland H</a><a class="btn" href="#insumos">Insumos</a></div></div>
 ${SEC.map(sect).join("")}
 <section id="insumos" style="padding-top:0"><div class="wrap"><h2>Insumos para el agro</h2><p class="sub">Consultá disponibilidad y precios.</p>
 <div class="box"><h3>🌽 Semillas de maíz DEKALB</h3><p>Genética de maíz DEKALB. Consultanos por híbridos y disponibilidad.</p><a class="btn" target="_blank" rel="noopener" href="${wa("Hola, quiero consultar por semillas de maíz DEKALB.")}">Consultar semillas</a></div>
 <div class="box"><h3>🧪 Laboratorios Peyte</h3><p>Productos fitosanitarios y fertilizantes de Laboratorios Peyte (Venado Tuerto, Santa Fe). Tocá cada categoría para ver los productos.</p>
 ${PEYTE.map(([t,l])=>`<details><summary>${esc(t)} (${l.length})</summary><div class="prod">${l.map(([a,b])=>`<div><b>${esc(a)}</b>${b?`<small>${esc(b)}</small>`:""}</div>`).join("")}</div></details>`).join("")}
 <p style="margin:12px 0 0;font-size:.85rem">Información de <a href="https://www.peyte.com.ar/productos.php" target="_blank" rel="noopener" style="color:var(--green-d)">peyte.com.ar</a>. Consultá las etiquetas y recomendaciones técnicas antes de aplicar.</p></div></div></section>
 <section id="contacto"><div class="wrap"><div class="contact"><h2>Hablemos</h2><p>Llamanos o escribinos para consultar stock, precios y financiación.</p>
 <div class="row"><a class="btn" href="tel:+${TEL}">📞 Llamar</a><a class="btn" target="_blank" rel="noopener" href="${wa("Hola, vi la página de Z CAMS División Agrícola y quiero hacer una consulta.")}" style="background:#25d366;color:#0b2e17">💬 WhatsApp</a><a class="btn" href="mailto:${MAIL}" style="background:#fff;color:#1f4d20">✉️ Email</a></div>
 <p style="margin:16px 0 0;font-weight:700">+54 9 3465 484303</p><p style="margin:2px 0 0"><a class="m" href="mailto:${MAIL}">${MAIL}</a></p></div></div></section>
 <footer>© Z CAMS División Agrícola. Todos los derechos reservados.${canEdit?`<br><button class="chip" data-a="toggle" style="margin-top:10px">${editing?"Salir del modo edición":"✏️ Modo edición"}</button>`:""}</footer>
 ${editing&&dirty?`<div class="savebar"><span>Tenés cambios sin publicar</span><button class="btn" data-a="save">Guardar y publicar</button></div>`:""}`;
}
function toast(t){const e=$("modal");e.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>{if(e.firstChild&&e.firstChild.className==="toast")e.innerHTML=""},3500);}
function find(k,id){return S[k].find(x=>x.id===id);}
let tmp=null,tk=null;
function form(){
 const it=tmp,cs=[...new Set([...S.maq,...S.rol].map(x=>x.c))];
 $("modal").innerHTML=`<div class="ov"><div class="dlg"><h3>${it._new?"Agregar producto":"Editar producto"}</h3>
 <label>Nombre<input id="f_n" value="${esc(it.n)}"></label>
 <label>Categoría<input id="f_c" list="cl" value="${esc(it.c)}"><datalist id="cl">${cs.map(x=>`<option value="${esc(x)}">`).join("")}</datalist></label>
 <div class="two"><label>Año<input id="f_y" value="${esc(it.y)}"></label><label>Estado<input id="f_e" placeholder="Nuevo / Usado" value="${esc(it.e)}"></label></div>
 <div class="two"><label>Disponibilidad<select id="f_s">${["Disponible","Reservado","Vendido"].map(x=>`<option ${x===(it.s||"Disponible")?"selected":""}>${x}</option>`).join("")}</select></label><label>Precio (opcional)<input id="f_pr" placeholder="Ej: u$d 35.000" value="${esc(it.pr)}"></label></div>
 <label>Detalles (uno por línea)<textarea id="f_d" rows="5">${esc((it.d||[]).join("\n"))}</textarea></label>
 <label>Forma de pago<input id="f_p" value="${esc(it.p)}"></label>
 <div class="lbl">Fotos</div><div class="pths">${(it.ph||[]).map((x,i)=>`<div class="pt"><img alt="" src="${bl(x)}"><button data-a="rmph" data-i="${i}">✕</button></div>`).join("")}</div>
 <input type="file" id="f_f" accept="image/*" multiple><div id="f_up" class="sub"></div>
 <div class="acts">${it._new?"":`<button class="btn del" data-a="del">Eliminar</button>`}<span style="flex:1"></span><button class="btn gr" data-a="cancel">Cancelar</button><button class="btn" data-a="ok">Aceptar</button></div></div></div>`;
 $("f_f").onchange=upl;
}
function grab(){const g=i=>$(i).value.trim();Object.assign(tmp,{n:g("f_n"),c:g("f_c")||"Otros",y:g("f_y"),e:g("f_e"),s:$("f_s").value,pr:g("f_pr"),p:g("f_p"),d:$("f_d").value.split("\n").map(x=>x.trim()).filter(Boolean)});}
async function shrink(f){const b=await createImageBitmap(f),m=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*m);c.height=Math.round(b.height*m);c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.82));}
async function upl(e){
 const as=await claude.use("assets");if(!as){$("f_up").textContent="No tenés permiso para subir fotos.";return;}
 grab();const fs=[...e.target.files];
 for(let i=0;i<fs.length;i++){try{$("f_up").textContent="Subiendo "+(i+1)+" de "+fs.length+"…";const r=await as.upload(await shrink(fs[i]));(tmp.ph=tmp.ph||[]).push(r.id);}catch(x){$("f_up").textContent="Error al subir una foto.";}}
 form();
}
let lb=null;
function lbox(){const L=lb;$("modal").innerHTML=`<div class="ov lbx" data-a="lbc"><img alt="" src="${bl(L.p[L.i])}">${L.p.length>1?`<button class="nv l" data-a="lbp">‹</button><button class="nv r" data-a="lbn">›</button>`:""}<button class="nv x" data-a="lbc">✕</button></div>`;}
async function save(){
 const a=await claude.use("artifact");if(!a){toast("No se pudo guardar desde acá.");return;}
 const st=JSON.stringify(S).replace(/</g,"\\u003c");
 const doc="<!DOCTYPE html><html lang=\"es\"><head>"+HEAD+"<style id=\"css\">"+$("css").textContent+"</style></head><body><div id=\"root\"></div><div id=\"modal\"></div><script id=\"state\" type=\"application/json\">"+st+"<\/script><script id=\"app\">"+$("app").textContent+"<\/script></body></html>";
 try{toast("Publicando…");await a.publish(doc);}catch(e){toast(e&&e.code==="conflict"?"Hubo otro cambio al mismo tiempo. Recargá e intentá de nuevo.":"No se pudo publicar. Probá de nuevo.");}
}
document.addEventListener("click",ev=>{
 const t=ev.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,k=t.dataset.k;
 if(a==="cat"){cat[k]=t.dataset.c;render();}
 else if(a==="toggle"){editing=!editing;render();}
 else if(a==="add"){tk=k;tmp={id:"i"+Date.now(),n:"",c:cat[k]!=="Todas"?cat[k]:"",y:"",e:"",s:"Disponible",pr:"",p:"",d:[],ph:[],_new:true};form();}
 else if(a==="edit"){tk=k;tmp=JSON.parse(JSON.stringify(find(k,t.dataset.id)));form();}
 else if(a==="cancel"){tmp=null;$("modal").innerHTML="";}
 else if(a==="ok"){grab();if(!tmp.n){$("f_n").focus();return;}const n=tmp._new;delete tmp._new;if(n)S[tk].unshift(tmp);else S[tk][S[tk].findIndex(x=>x.id===tmp.id)]=tmp;dirty=true;tmp=null;$("modal").innerHTML="";render();}
 else if(a==="del"){if(confirm("¿Eliminar este producto?")){S[tk]=S[tk].filter(x=>x.id!==tmp.id);dirty=true;tmp=null;$("modal").innerHTML="";render();}}
 else if(a==="rmph"){grab();tmp.ph.splice(+t.dataset.i,1);form();}
 else if(a==="save")save();
 else if(a==="lb"&&!editing){const it=find(k,t.dataset.id);lb={p:it.ph,i:0};lbox();}
 else if(a==="lbn"){ev.stopPropagation();lb.i=(lb.i+1)%lb.p.length;lbox();}
 else if(a==="lbp"){ev.stopPropagation();lb.i=(lb.i+lb.p.length-1)%lb.p.length;lbox();}
 else if(a==="lbc"){lb=null;$("modal").innerHTML="";}
});
render();
(async()=>{try{const u=await claude.use("user");if(u&&await u.canEdit()){canEdit=true;render();}}catch(e){}})();
</script></body></html>
